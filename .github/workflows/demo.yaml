name: PR demo

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEMOS_ENABLED == 'true'
    uses: ./.github/workflows/demo-deploy-reusable.yaml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      commit-sha: ${{ github.event.pull_request.head.sha }}
      api-url: ${{ vars.DEMOS_API_URL }}
    secrets:
      demos-hmac-key: ${{ secrets.DEMOS_HMAC_KEY }}

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEMOS_ENABLED == 'true'
    uses: ./.github/workflows/demo-cleanup-reusable.yaml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      api-url: ${{ vars.DEMOS_API_URL }}
    secrets:
      demos-hmac-key: ${{ secrets.DEMOS_HMAC_KEY }}
