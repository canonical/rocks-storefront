name: rocks-storefront
version: '1.1'
summary: Rocked store page for rocks
description: |
  This is the OCI image for the rocks storefront application.
  It offers users the possibility to search and inspect details
  of rocks uploaded to Canonical's registry.

base: bare
build-base: ubuntu@24.04
platforms:
  amd64:
  arm64:

# The parts are taken from the expressjs-framework extension but without
# using it, as the project doesn't follow the required structure
parts:
  expressjs-framework/install-app:
    npm-node-version: lts/krypton
    npm-include-node: true
    build-snaps:
    - node/24/stable
    override-build: |
      # The image in which the rock is built has the NODE_ENV=production variable set
      # and that causes `npm install` to skip dev dependencies; we need them to build
      # the app so we specify that they must be included
      npm ci --include=dev
      npm run build

      # copy built files to install directory so that they remain in rock's final image
      craftctl default
      mkdir -p ${CRAFT_PART_INSTALL}/app
      cp -r ${CRAFT_PART_BUILD}/build ${CRAFT_PART_INSTALL}/app
      cp ${CRAFT_PART_BUILD}/package.json ${CRAFT_PART_INSTALL}/app
      cp ${CRAFT_PART_BUILD}/.npmrc ${CRAFT_PART_INSTALL}/app

      # install just the node_modules needed for production (no dev dependencies)
      npm install --ignore-scripts --prefix ${CRAFT_PART_INSTALL}/app

      # delete duplicated node_modules from the final rock (imported by this npm plugin)
      rm -rf ${CRAFT_PART_INSTALL}/lib/node_modules/*
      rm -f ${CRAFT_PART_INSTALL}/bin/corepack ${CRAFT_PART_INSTALL}/bin/np*

      # apply the _daemon_ user ownership to the app
      chown -R 584792:584792 ${CRAFT_PART_INSTALL}/app
    prime:
      # the npm plugin adds node's C++ header files to the rock by default
      # we don't need them, so we exclude them from the prime step
      - -include/node
    plugin: npm
    source: .
    stage-packages:
    - bash_bins
    - ca-certificates_data
    - coreutils_bins

  expressjs-framework/runtime:
    plugin: nil
    stage-packages:
    - libstdc++6
    - zlib1g
    stage:
    - -etc/ssl/certs/ca-certificates.crt

  # 584792 is the _daemon_ user and group that runs the application
  # these directories are used when integrating the app with COS
  expressjs-framework/logging:
    plugin: nil
    override-build: |-
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/opt/promtail
      mkdir -p $CRAFT_PART_INSTALL/etc/promtail
    permissions:
    - path: opt/promtail
      owner: 584792
      group: 584792
    - path: etc/promtail
      owner: 584792
      group: 584792

  # `juju ssh` needs "sh" command to work
  # we alias it here so that we can SSH into the rock via juju
  debugging:
    plugin: nil
    after:
      - expressjs-framework/install-app
    override-build: |
      craftctl default
      mkdir -p ${CRAFT_PART_INSTALL}/bin ${CRAFT_PART_INSTALL}/usr/bin
      ln -sf /usr/bin/bash ${CRAFT_PART_INSTALL}/bin/sh
      ln -sf /usr/bin/bash ${CRAFT_PART_INSTALL}/usr/bin/sh

run-user: _daemon_
services:
  # name must stay like this because the charm references it
  expressjs:
    override: replace
    command: node build/index.js
    startup: enabled
    environment:
      NODE_ENV: production
    user: _daemon_
    working-dir: /app
